<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" aria-labelledby="title desc">
  <title id="title">Rakshith Chandupatla profile illustration</title>
  <desc id="desc">A portfolio profile illustration with initials RC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c30"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.77  0 0 0 0 0.37  0 0 0 .5 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="560" height="640" rx="18" fill="url(#bg)"/>
  <path d="M0 520 C120 460 190 560 320 505 C430 460 455 360 560 390 L560 640 L0 640 Z" fill="#0f172a"/>
  <g opacity=".16" stroke="#22c55e" stroke-width="1">
