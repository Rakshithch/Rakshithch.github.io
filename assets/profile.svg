    <path d="M150 60 V560"/><path d="M280 60 V560"/><path d="M410 60 V560"/>
  </g>
  <path d="M60 470 L150 430 L240 445 L330 360 L420 385 L500 300" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <circle cx="280" cy="230" r="116" fill="#131c30" stroke="#22c55e" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="280" cy="205" r="52" fill="#22c55e" opacity=".92"/>
  <path d="M174 352 C194 288 236 260 280 260 C324 260 366 288 386 352 C352 382 316 396 280 396 C244 396 208 382 174 352 Z" fill="#22c55e" opacity=".88"/>
  <g filter="url(#glow)">
    <rect x="98" y="460" width="364" height="92" rx="12" fill="#0b1120" stroke="#22c55e" stroke-opacity=".5"/>
    <text x="280" y="522" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="46" font-weight="800" fill="#f1f5f9" letter-spacing="4">RC_</text>
  </g>
  <text x="280" y="582" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#94a3b8">Data Analyst &amp; ML Engineer</text>
