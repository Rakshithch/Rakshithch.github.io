<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" aria-labelledby="title desc">
  <title id="title">Rakshith Chandupatla profile illustration</title>
  <desc id="desc">A Knicks-themed portfolio profile illustration with initials RC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a3a"/>
      <stop offset="1" stop-color="#04091a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F58426"/>
      <stop offset="1" stop-color="#006BB6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.52  0 0 0 0 0.15  0 0 0 .45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="560" height="640" rx="18" fill="url(#bg)"/>
  <path d="M0 520 C120 460 190 560 320 505 C430 460 455 360 560 390 L560 640 L0 640 Z" fill="#081226"/>
  <!-- court lines -->
  <g opacity=".25" fill="none" stroke="#4da6ff" stroke-width="1.5">
    <circle cx="280" cy="640" r="180"/>
    <circle cx="280" cy="640" r="70"/>
    <path d="M0 560 H560"/>
  </g>
  <!-- basketball -->
  <g opacity=".9">
    <circle cx="470" cy="96" r="38" fill="#F58426" stroke="#7a3c0d" stroke-width="2"/>
    <g fill="none" stroke="#7a3c0d" stroke-width="2">
      <path d="M432 96h76"/>
      <path d="M470 58v76"/>
      <path d="M444 69c14 13 14 41 0 54"/>
      <path d="M496 69c-14 13-14 41 0 54"/>
    </g>
  </g>
  <circle cx="280" cy="230" r="116" fill="#0c1a3a" stroke="#F58426" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="280" cy="205" r="52" fill="url(#accent)" opacity=".95"/>
  <path d="M174 352 C194 288 236 260 280 260 C324 260 366 288 386 352 C352 382 316 396 280 396 C244 396 208 382 174 352 Z" fill="url(#accent)" opacity=".9"/>
  <g filter="url(#glow)">
    <rect x="98" y="460" width="364" height="92" rx="8" fill="#060e22" stroke="#F58426" stroke-opacity=".55"/>
    <text x="280" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#eef4fb" letter-spacing="8">RC</text>
  </g>
  <text x="280" y="582" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#93a7c4">Data Analyst &amp; ML Engineer</text>
</svg>
