<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Rakshith Chandupatla portfolio social card</title>
  <desc id="desc">Social preview card for Rakshith Chandupatla, Data Analyst and ML Engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset=".55" stop-color="#12121c"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#41e3c5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity=".12" stroke="#8b7bff" stroke-width="1">
    <path d="M80 150 H1120"/><path d="M80 300 H1120"/><path d="M80 450 H1120"/>
    <path d="M300 60 V570"/><path d="M540 60 V570"/><path d="M780 60 V570"/><path d="M1020 60 V570"/>
  </g>
  <!-- trend line motif -->
  <path d="M120 470 L300 420 L480 440 L660 330 L840 360 L1080 250" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  <rect x="78" y="92" width="1044" height="446" rx="20" fill="#0e0e16" stroke="#8b7bff" stroke-opacity=".3"/>
  <!-- monogram -->
  <rect x="118" y="132" width="110" height="110" rx="20" fill="#14141d" stroke="#8b7bff" stroke-opacity=".5"/>
  <text x="173" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="500" font-style="italic" fill="url(#grad)">RC</text>
  <text x="118" y="318" font-family="Georgia, serif" font-size="66" font-weight="500" fill="#f3f1ee">Rakshith Chandupatla</text>
  <text x="118" y="372" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#8b7bff">Data Analyst &amp; ML Engineer</text>
  <text x="118" y="430" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#a4a1b8">SQL • Python • Power BI/Tableau • Predictive Analytics • Risk Modeling</text>
  <rect x="118" y="472" width="510" height="6" rx="3" fill="url(#grad)"/>
  <text x="118" y="518" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#62607a">rakshithch.github.io</text>
